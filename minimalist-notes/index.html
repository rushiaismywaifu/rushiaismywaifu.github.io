<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>📝 Minimalist Notes</title>
    
    <!-- Meta -->
    <meta name="author" content="ChatGPT × Claude AI 🤖">
    <meta name="description" content="極簡暗黑筆記本 — 自動保存 • 跨分頁同步 • 離線可用">
    <meta name="keywords" content="notes, 筆記, 極簡, minimalist, dark theme, offline, PWA">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="dark">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        img-src 'self' data:;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        worker-src 'self';
        manifest-src 'self';
        connect-src 'none';
        object-src 'none';
        base-uri 'none';
        form-action 'none';
    ">
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Notes">

    <!-- Canonical -->
    <link rel="canonical" href="https://rushiaismywaifu.github.io/minimalist-notes/">

    <!-- Open Graph（爬蟲不解析相對路徑，一律用絕對網址） -->
    <meta property="og:title" content="📝 Minimalist Notes">
    <meta property="og:description" content="極簡暗黑筆記本 — 你的思緒值得一個安靜的角落">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rushiaismywaifu.github.io/minimalist-notes/">
    <meta property="og:image" content="https://rushiaismywaifu.github.io/minimalist-notes/assets/icon-512.png">
    <meta property="og:site_name" content="Rushia My Beloved">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="📝 Minimalist Notes">
    <meta name="twitter:description" content="極簡暗黑筆記本 — 你的思緒值得一個安靜的角落">
    <meta name="twitter:image" content="https://rushiaismywaifu.github.io/minimalist-notes/assets/icon-512.png">

    <!-- Favicon -->
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="shortcut icon" href="./assets/icon-192.png">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            color: #f0f0f0;
        }
        
        #doc {
            display: block;
            width: 100%;
            height: 100dvh;
            border: none;
            padding: 1.5rem;
            padding-bottom: 3rem;
            font-size: 1.125rem;
            line-height: 1.7;
            background-color: #111;
            color: #f0f0f0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            tab-size: 2;
            resize: none;
            font-family: 'SF Mono', Menlo, Consolas, Monaco, 'Liberation Mono', 
                         'Lucida Console', 'Courier New', monospace;
            caret-color: #6cf;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: thin;
            scrollbar-color: #333 #1a1a1a;
        }
        
        @supports not (height: 100dvh) {
            #doc { height: 100%; }
        }
        
        #doc:focus { outline: none; }
        #doc::placeholder { color: #555; font-style: italic; }
        #doc::selection { background-color: #346; color: #fff; }
        
        /* Scrollbar */
        #doc::-webkit-scrollbar { width: 10px; }
        #doc::-webkit-scrollbar-track { background: #1a1a1a; }
        #doc::-webkit-scrollbar-thumb { 
            background: #333; 
            border-radius: 5px; 
            border: 2px solid #1a1a1a; 
        }
        #doc::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Status */
        #status {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            background: rgba(30, 30, 30, 0.9);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: #888;
            max-width: calc(100% - 2rem);
            opacity: 0;
            transform: translateY(10px);
            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        #status.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Counter — 常駐但刻意低調，有 status 時讓位 */
        #count {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            padding: 0.4rem 0.8rem;
            background: rgba(30, 30, 30, 0.9);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid #2a2a2a;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-family: system-ui, -apple-system, sans-serif;
            font-variant-numeric: tabular-nums;
            color: #555;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            z-index: 999;
        }

        #count.show { opacity: 1; }

        /* No-JS fallback */
        #nojs {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #111;
            color: #888;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            line-height: 1.8;
            text-align: center;
            z-index: 2000;
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            #doc {
                padding-bottom: calc(3rem + env(safe-area-inset-bottom));
            }
            #status, #count {
                bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <textarea 
        id="doc"
        aria-label="筆記內容"
        autofocus
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        placeholder="開始書寫...
───────────────────────────
  ✨  自動保存至瀏覽器
  🔄  即時跨分頁同步
  📴  支援離線使用
  ⌨️  Ctrl+S 手動保存
  ⬇️  Ctrl+Shift+S 匯出備份
───────────────────────────"
    ></textarea>
    
    <div id="count"></div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
        <div id="nojs">⚠️ 這個筆記本需要 JavaScript 才能運作<br>請在瀏覽器設定中啟用後重新整理。</div>
    </noscript>

    <script>
    (() => {
        'use strict';
        
        const CONFIG = Object.freeze({
            STORAGE_KEY_DOC: 'notes-content-v2',
            STORAGE_KEY_TIME: 'notes-timestamp-v2',
            STORAGE_KEY_VIEW: 'notes-view-v2',
            DEBOUNCE_DELAY: 300,
            VIEW_SAVE_DELAY: 500,
            COUNT_DELAY: 120,
            STATUS_DISPLAY_TIME: 2000,
            // storage 事件才是主要同步管道，輪詢只是保險，不需要太密
            SYNC_INTERVAL: 5000
        });

        const doc = document.getElementById('doc');
        const status = document.getElementById('status');
        const count = document.getElementById('count');

        let lastSaveTime = 0;
        let statusTimeoutId = null;
        let dirty = false;
        let warnedConflictTime = 0;
        let applyingRemote = false;   // 抑制我們自己觸發的 input 事件
        let lastViewJSON = '';

        // 各瀏覽器的配額例外名稱／代碼都不一樣
        function isQuotaError(e) {
            return e instanceof DOMException && (
                e.name === 'QuotaExceededError' ||
                e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
                e.code === 22 || e.code === 1014
            );
        }

        // Storage
        const storage = {
            isAvailable: (() => {
                try {
                    const test = '__test__';
                    localStorage.setItem(test, test);
                    localStorage.removeItem(test);
                    return true;
                } catch { return false; }
            })(),
            
            get(key) {
                try { return localStorage.getItem(key); } 
                catch { return null; }
            },
            
            set(key, value) {
                try {
                    localStorage.setItem(key, value);
                    return true;
                } catch (e) {
                    // 任何寫入失敗都必須讓使用者知道，否則就是靜默掉資料
                    showStatus(
                        isQuotaError(e)
                            ? '⚠️ 儲存空間已滿，請用 Ctrl+Shift+S 匯出備份'
                            : '⚠️ 儲存失敗，請匯出備份',
                        5000
                    );
                    return false;
                }
            }
        };
        
        // UI
        function showStatus(message, duration = CONFIG.STATUS_DISPLAY_TIME) {
            status.textContent = message;
            status.classList.add('show');
            count.classList.remove('show');   // 窄螢幕上兩顆膠囊會撞在一起
            clearTimeout(statusTimeoutId);
            statusTimeoutId = setTimeout(() => {
                status.classList.remove('show');
                updateCount();
            }, duration);
        }

        function debounce(fn, delay) {
            let id;
            return (...args) => { clearTimeout(id); id = setTimeout(() => fn(...args), delay); };
        }

        function updateCount() {
            const value = doc.value;
            if (!value) {
                count.classList.remove('show');
                return;
            }

            const selected = doc.selectionEnd - doc.selectionStart;
            if (selected > 0) {
                count.textContent = `選取 ${selected} 字`;
            } else {
                let lines = 1;
                for (let i = value.indexOf('\n'); i !== -1; i = value.indexOf('\n', i + 1)) lines++;
                count.textContent = `${value.length} 字 · ${lines} 行`;
            }

            // status 佔用中就先不搶版面，等它收起來時再補上
            if (!status.classList.contains('show')) count.classList.add('show');
        }

        const scheduleCount = debounce(updateCount, CONFIG.COUNT_DELAY);

        // View state（游標與捲動位置）
        // 寫兩份：sessionStorage 是這個分頁自己的、精確；localStorage 讓下次開瀏覽器
        // 還能回到原位。失敗一律靜默 —— 這只是 UI 狀態，不值得跳警告嚇人。
        // 傳 getter 而非物件本身：sandboxed iframe 連讀 sessionStorage 屬性都會丟 SecurityError
        function writeView(getStore, view) {
            try { getStore().setItem(CONFIG.STORAGE_KEY_VIEW, view); } catch { /* 無所謂 */ }
        }

        function readView(getStore) {
            try { return getStore().getItem(CONFIG.STORAGE_KEY_VIEW); } catch { return null; }
        }

        function saveView() {
            const view = JSON.stringify({
                s: doc.selectionStart,
                e: doc.selectionEnd,
                t: Math.round(doc.scrollTop)
            });
            if (view === lastViewJSON) return;
            lastViewJSON = view;
            writeView(() => sessionStorage, view);
            writeView(() => localStorage, view);
        }

        const debouncedSaveView = debounce(saveView, CONFIG.VIEW_SAVE_DELAY);

        function restoreView(len) {
            // 同分頁的紀錄優先，多開分頁時才不會互相搶游標
            const raw = readView(() => sessionStorage) ?? readView(() => localStorage);
            if (!raw) return;

            let view;
            try { view = JSON.parse(raw); } catch { return; }
            if (!view || typeof view.s !== 'number') return;

            lastViewJSON = raw;
            doc.setSelectionRange(Math.min(view.s, len), Math.min(view.e ?? view.s, len));
            // 等 textarea 完成排版後再捲，否則 scrollTop 會被夾成 0。
            // 這一幀之間使用者可能已經自己捲過了，那就別跟人家搶。
            requestAnimationFrame(() => {
                if (doc.scrollTop === 0) doc.scrollTop = view.t || 0;
            });
        }

        // 用可復原的方式換掉全文，保住瀏覽器原生的 undo stack。
        // execCommand 已廢棄，但仍是 textarea 唯一的跨瀏覽器做法，失敗就退回直接指派。
        function replaceValue(next) {
            const start = doc.selectionStart;
            const end = doc.selectionEnd;
            const top = doc.scrollTop;
            let ok = false;

            applyingRemote = true;
            try {
                if (document.activeElement === doc && document.execCommand) {
                    doc.setSelectionRange(0, doc.value.length);
                    ok = next === ''
                        ? document.execCommand('delete')
                        : document.execCommand('insertText', false, next);
                }
            } catch { ok = false; }

            if (!ok || doc.value !== next) doc.value = next;
            applyingRemote = false;

            const len = next.length;
            doc.setSelectionRange(Math.min(start, len), Math.min(end, len));
            doc.scrollTop = top;
        }

        // Core
        function loadContent() {
            const content = storage.get(CONFIG.STORAGE_KEY_DOC);
            const time = storage.get(CONFIG.STORAGE_KEY_TIME);
            lastSaveTime = time ? Number(time) : 0;
            if (content !== null) {
                doc.value = content;
                restoreView(content.length);
            }
            updateCount();
        }

        function saveContent(notify = true) {
            // 沒有變動就不要寫入：localStorage 是同步的，而且推進 timestamp
            // 會讓其他分頁全部收到 storage 事件白跑一輪
            if (!dirty) {
                if (notify) showStatus('✓ 已是最新');
                return true;
            }

            const now = Date.now();
            if (
                storage.set(CONFIG.STORAGE_KEY_DOC, doc.value) &&
                storage.set(CONFIG.STORAGE_KEY_TIME, now.toString())
            ) {
                lastSaveTime = now;
                dirty = false;
                warnedConflictTime = 0;
                if (notify) showStatus('✓ 已保存');
                return true;
            }
            return false;
        }
        
        const debouncedSave = debounce(() => saveContent(true), CONFIG.DEBOUNCE_DELAY);
        
        function syncFromStorage(force = false) {
            const storedTime = Number(storage.get(CONFIG.STORAGE_KEY_TIME)) || 0;
            if (storedTime <= lastSaveTime) return;

            if (!force && dirty && document.activeElement === doc) {
                // 不打斷正在打字的人，但待存的變更 300ms 後就會蓋掉對方 —
                // 訊息要照實說。同一個 storedTime 只提醒一次，否則每輪都跳。
                if (storedTime !== warnedConflictTime) {
                    warnedConflictTime = storedTime;
                    showStatus('⚠️ 另一分頁也改過，將以此分頁的內容為準', 3000);
                }
                return;
            }

            const content = storage.get(CONFIG.STORAGE_KEY_DOC);
            if (content === null) return;   // 資料不完整，等下一輪再說

            // 不論內容是否真的不同都要推進 lastSaveTime，
            // 否則之後每一輪都會重讀整份筆記再比對一次，永遠停不下來
            lastSaveTime = storedTime;
            warnedConflictTime = 0;
            dirty = false;

            if (content !== doc.value) {
                replaceValue(content);
                updateCount();
                showStatus('🔄 已同步');
            }
        }
        
        // Export backup as .txt
        function exportBackup() {
            const blob = new Blob([doc.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notes-${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            // 立刻 revoke 會讓部分瀏覽器中斷下載
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showStatus('⬇️ 已匯出');
        }
        
        // Events
        function setupEvents() {
            doc.addEventListener('input', () => {
                scheduleCount();
                if (applyingRemote) return;   // replaceValue 造成的，不是使用者打的
                dirty = true;
                debouncedSave();
                debouncedSaveView();
            });

            // selectionchange 在 textarea 上不是每個瀏覽器都可靠，補幾個保險
            document.addEventListener('selectionchange', () => {
                if (document.activeElement !== doc) return;
                scheduleCount();
                debouncedSaveView();
            });
            doc.addEventListener('keyup', debouncedSaveView);
            doc.addEventListener('mouseup', debouncedSaveView);
            doc.addEventListener('scroll', debouncedSaveView, { passive: true });

            // Only listen to timestamp key — let syncFromStorage decide
            window.addEventListener('storage', (e) => {
                if (e.key === CONFIG.STORAGE_KEY_TIME) {
                    syncFromStorage();
                }
            });
            
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    saveContent(false);
                    saveView();
                } else {
                    syncFromStorage();
                }
            });

            // 只用 pagehide：它涵蓋 beforeunload 的所有情境，
            // 而註冊 beforeunload 會讓頁面失去 bfcache 資格
            window.addEventListener('pagehide', () => {
                saveContent(false);
                saveView();
            });

            // 綁在 document 上，焦點不在 textarea 時也不會漏給瀏覽器的「儲存網頁」
            document.addEventListener('keydown', (e) => {
                if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
                if (e.key.toLowerCase() !== 's') return;

                e.preventDefault();
                if (e.shiftKey) exportBackup();   // Ctrl+Shift+S → 匯出備份
                else saveContent(true);           // Ctrl+S → 手動保存
            });
        }
        
        // Service Worker
        function registerSW() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('✅ SW registered'))
                    .catch(() => console.log('ℹ️ SW not available'));
            }
        }
        
        // Init
        function init() {
            if (!storage.isAvailable) {
                alert('⚠️ 瀏覽器不支援本地儲存，筆記將無法保存。');
                return;
            }
            loadContent();
            setupEvents();
            registerSW();

            // 背景分頁不需要輪詢，回到前景時 visibilitychange 會補同步
            setInterval(() => {
                if (document.visibilityState === 'visible') syncFromStorage();
            }, CONFIG.SYNC_INTERVAL);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
