<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗屏 · 螢幕保護</title>
<meta name="description" content="一片安靜的黑。可以只是全黑，也可以加上緩慢的星空、塵埃、呼吸光暈、時鐘或字雨。">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><circle cx='16' cy='16' r='2.5' fill='%23C9A227'/></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="src/main.js">
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<p id="hint">移動滑鼠顯示控制列<br><kbd>F</kbd> 全螢幕　<kbd>H</kbd> 收起控制列　<kbd>1</kbd>–<kbd>6</kbd> 切換</p>

<nav id="bar" aria-label="螢幕保護設定">
  <div id="modes" role="group" aria-label="效果"></div>
  <div class="sep"></div>
  <div class="slot"><span>亮</span><input id="bright" type="range" min="5" max="100" value="80" aria-label="亮度"></div>
  <div class="slot"><span>速</span><input id="speed" type="range" min="20" max="200" value="100" aria-label="速度"></div>
  <div class="sep"></div>
  <button class="ico" id="awake" aria-pressed="false" title="防止螢幕休眠">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7"/></svg>
  </button>
  <button class="ico" id="full" aria-pressed="false" title="全螢幕（F）">
    <svg viewBox="0 0 24 24"><path d="M8.5 3.5h-5v5M15.5 3.5h5v5M8.5 20.5h-5v-5M15.5 20.5h5v-5"/></svg>
  </button>
</nav>

<script type="module" src="src/main.js"></script>
<noscript><style>#hint,#bar{display:none}</style></noscript>
</body>
</html>
