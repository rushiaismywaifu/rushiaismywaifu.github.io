<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="瀏覽、搜尋與篩選 Discord Quests，查看任務狀態、獎勵、參與方式、地區及年齡限制。">
  <meta name="theme-color" content="#0b0d12">
  <title>Discord Quest Explorer</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/responsive.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#questResults">跳到任務列表</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="任務篩選">
      <div class="sidebar-head">
        <a class="brand" href="./" aria-label="Discord Quest Explorer 首頁">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span class="brand-copy">
            <strong>Quest Explorer</strong>
            <small>GitHub 公開任務資料</small>
          </span>
        </a>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="關閉篩選">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <a class="home-link" href="../index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m3 11 9-8 9 8"></path>
          <path d="M5 10v10h14V10M9 20v-6h6v6"></path>
        </svg>
        返回主首頁
      </a>

      <div class="filter-scroll">
        <section class="filter-section" aria-labelledby="statusHeading">
          <div class="section-heading">
            <h2 id="statusHeading">任務狀態</h2>
          </div>
          <div class="filter-list" role="group" aria-label="依任務狀態篩選">
            <button class="nav-item" type="button" data-filter="all" aria-pressed="false">
              <span class="dot all" aria-hidden="true"></span><span>全部</span><span class="count" id="cnt-all">0</span>
            </button>
            <button class="nav-item active" type="button" data-filter="live" aria-pressed="true">
              <span class="dot live" aria-hidden="true"></span><span>進行中</span><span class="count" id="cnt-live">0</span>
            </button>
            <button class="nav-item" type="button" data-filter="upcoming" aria-pressed="false">
              <span class="dot up" aria-hidden="true"></span><span>即將開始</span><span class="count" id="cnt-upcoming">0</span>
            </button>
            <button class="nav-item" type="button" data-filter="ended" aria-pressed="false">
              <span class="dot end" aria-hidden="true"></span><span>已結束</span><span class="count" id="cnt-ended">0</span>
            </button>
          </div>
        </section>

        <section class="filter-section" aria-labelledby="rewardHeading">
          <div class="section-heading">
            <h2 id="rewardHeading">獎勵類型</h2>
          </div>
          <div class="filter-list" role="group" aria-label="依獎勵類型篩選">
            <button class="nav-item active" type="button" data-reward="all" aria-pressed="true">
              <span class="dot all" aria-hidden="true"></span><span>全部獎勵</span><span class="count" id="rcnt-all">0</span>
            </button>
            <button class="nav-item" type="button" data-reward="orbs" aria-pressed="false">
              <span class="dot orbs" aria-hidden="true"></span><span>Orbs</span><span class="count" id="rcnt-orbs">0</span>
            </button>
            <button class="nav-item" type="button" data-reward="avatar" aria-pressed="false">
              <span class="dot avatar" aria-hidden="true"></span><span>頭像裝飾</span><span class="count" id="rcnt-avatar">0</span>
            </button>
            <button class="nav-item" type="button" data-reward="ingame" aria-pressed="false">
              <span class="dot ingame" aria-hidden="true"></span><span>遊戲內獎勵</span><span class="count" id="rcnt-ingame">0</span>
            </button>
            <button class="nav-item" type="button" data-reward="nitro" aria-pressed="false">
              <span class="dot nitro" aria-hidden="true"></span><span>Nitro</span><span class="count" id="rcnt-nitro">0</span>
            </button>
          </div>
        </section>

        <section class="filter-section" aria-labelledby="taskHeading">
          <div class="section-heading">
            <h2 id="taskHeading">任務方式</h2>
          </div>
          <div class="filter-list" role="group" aria-label="依任務方式篩選">
            <button class="nav-item active" type="button" data-task="all" aria-pressed="true">
              <span class="dot all" aria-hidden="true"></span><span>全部方式</span><span class="count" id="tcnt-all">0</span>
            </button>
            <button class="nav-item" type="button" data-task="play" aria-pressed="false">
              <span class="dot play" aria-hidden="true"></span><span>遊玩</span><span class="count" id="tcnt-play">0</span>
            </button>
            <button class="nav-item" type="button" data-task="watch" aria-pressed="false">
              <span class="dot watch" aria-hidden="true"></span><span>觀看</span><span class="count" id="tcnt-watch">0</span>
            </button>
          </div>
        </section>

        <section class="filter-section" aria-labelledby="regionHeading">
          <div class="section-heading">
            <h2 id="regionHeading">參與條件</h2>
          </div>
          <label class="select-field" for="regionSel">
            <span>國家或地區</span>
            <select id="regionSel">
              <option value="">全部地區</option>
            </select>
          </label>
          <label class="select-field" for="ageSel">
            <span>年齡限制</span>
            <select id="ageSel">
              <option value="all">全部</option>
              <option value="age">需要年齡驗證</option>
              <option value="noage">無年齡限制</option>
            </select>
          </label>
        </section>

        <section class="filter-section" aria-labelledby="sortHeading">
          <div class="section-heading">
            <h2 id="sortHeading">排序</h2>
          </div>
          <label class="select-field" for="sortSel">
            <span class="visually-hidden">任務排序方式</span>
            <select id="sortSel">
              <option value="newest">最新開始</option>
              <option value="ending">即將結束</option>
              <option value="name">任務名稱 A–Z</option>
              <option value="game">遊戲名稱 A–Z</option>
            </select>
          </label>
        </section>
      </div>

      <footer class="sidebar-footer">
        <span>資料來自非官方公開來源</span>
        <span class="source-links">
          <a href="https://github.com/xGustavvo/discord-api-tracker" target="_blank" rel="noopener noreferrer">Quest data</a>
          <span aria-hidden="true">·</span>
          <a href="https://gist.github.com/xGustavvo/3d08b7369eb34b50834815fd43176cae" target="_blank" rel="noopener noreferrer">Restrictions</a>
        </span>
        <small>與 Discord Inc. 無關</small>
      </footer>
    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" tabindex="-1" aria-label="關閉篩選"></button>

    <section class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow">Quest database</p>
          <h1 class="page-title">Discord 任務總覽</h1>
        </div>

        <div class="topbar-actions">
          <button class="mobile-filter-btn" id="filterToggle" type="button" aria-label="篩選條件" aria-controls="sidebar" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 6h16M7 12h10M10 18h4"></path>
            </svg>
            <span>篩選</span>
            <span class="filter-count" id="activeFilterCount" hidden>0</span>
          </button>
          <span class="result-pill" id="totalPill" aria-live="polite">載入中…</span>
          <button class="refresh-btn" id="refreshBtn" type="button" aria-label="重新整理任務資料">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 6v5h-5"></path>
              <path d="M19 11a8 8 0 1 0 1 5"></path>
            </svg>
            <span>重新整理</span>
          </button>
        </div>

        <label class="search-bar" for="searchInput">
          <span class="visually-hidden">搜尋任務</span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.2-3.2"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="搜尋任務、遊戲、發行商或 ID…" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
      </header>

      <main class="content" id="questResults" tabindex="-1">
        <section class="summary-strip" aria-label="任務摘要">
          <article class="summary-card live-summary">
            <span class="summary-icon" aria-hidden="true">●</span>
            <strong class="summary-value" id="summaryLive">0</strong>
            <small class="summary-label">進行中</small>
          </article>
          <article class="summary-card upcoming-summary">
            <span class="summary-icon" aria-hidden="true">◷</span>
            <strong class="summary-value" id="summaryUpcoming">0</strong>
            <small class="summary-label">即將開始</small>
          </article>
          <article class="summary-card orb-summary">
            <span class="summary-icon" aria-hidden="true">✦</span>
            <strong class="summary-value" id="summaryOrbs">0</strong>
            <small class="summary-label">Orbs 任務</small>
          </article>
        </section>

        <section class="results-section" aria-labelledby="resultsTitle">
          <div class="results-head">
            <div class="results-copy">
              <p class="eyebrow">Discover</p>
              <h2 class="results-title" id="resultsTitle">進行中的任務</h2>
              <p class="results-meta" id="resultsMeta">正在整理公開任務資料…</p>
            </div>
            <div class="results-toolbar">
              <div class="active-filters" id="activeFilters" aria-label="目前篩選條件"></div>
              <button class="clear-filters" id="clearFilters" type="button" hidden>清除篩選</button>
            </div>
          </div>

          <div class="state" id="state" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <strong>正在抓取任務資料</strong>
            <span>首次載入可能需要幾秒鐘。</span>
          </div>
          <div class="grid" id="grid" hidden></div>
        </section>
      </main>
    </section>
  </div>

  <div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <article class="modal" id="modalCard"></article>
  </div>

  <noscript>
    <div class="noscript">這個頁面需要 JavaScript 才能載入 Discord 任務資料。</div>
  </noscript>
</body>
</html>
